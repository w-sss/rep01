  name: Sync Docker Images to GHCR

  on:
    workflow_dispatch:

  jobs:
    sync:
      runs-on: ubuntu-latest
      steps:
        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Sync images
          run: |
            IMAGES=(
              "victoriametrics/victoria-metrics:v1.144.0"
              "grafana/grafana:11.6.0"
            )
            for img in "${IMAGES[@]}"; do
              echo "Syncing $img"
              docker pull "$img"
              docker tag "$img" "ghcr.io/${{ github.repository_owner }}/${img}"
              docker push "ghcr.io/${{ github.repository_owner }}/${img}"
            done
